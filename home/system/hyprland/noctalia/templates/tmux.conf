set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g window-style "bg=default"
set -g window-active-style "bg=default"

set-option -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"

set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g message-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"
set -g message-command-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}"

setw -g window-status-format "#[fg={{colors.outline.default.hex}},bg={{colors.surface.default.hex}}] #I #W "
setw -g window-status-current-format "#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #I #W "

set -g status-left "#[fg={{colors.on_secondary.default.hex}},bg={{colors.secondary.default.hex}},bold] 󰊠 #S "

set -g status-right "#[fg={{colors.on_tertiary.default.hex}},bg={{colors.tertiary.default.hex}}] #H %H:%M "
